<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Footer clip options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0D1014;--line:#222931;--line-strong:#323B46;--text:#E6EAF0;--muted:#98A2AE;--subtle:#6A7480;
  --ease:cubic-bezier(.2,.8,.2,1);
  --sans:"Geist",ui-sans-serif,system-ui,sans-serif;--mono:"Geist Mono",ui-monospace,Menlo,monospace;
  --pad:56px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.wrap{max-width:1296px;margin:0 auto;padding:0 var(--pad)}
.mark{display:flex;align-items:center;gap:9px;font-weight:600;font-size:17px;letter-spacing:-.02em}

/* Each option is a page bottom on its own. The gap between them stands in for the end of the page. */
.opt{padding-top:120px;border-bottom:1px solid var(--line-strong)}
.opt:first-child{padding-top:72px}
.label{font:500 12px/1 var(--mono);color:var(--subtle);letter-spacing:.04em;text-transform:uppercase}
.label b{color:var(--text);font-weight:500}
.foot{display:flex;align-items:center;gap:32px;padding:24px 0;border-top:1px solid var(--line);font-size:14px;color:var(--muted);margin-top:24px}
.foot nav{display:flex;gap:24px;margin-left:auto}
.foot nav a:hover{color:var(--text)}
.wm-clip{overflow:hidden;margin-top:40px;padding:0 var(--pad)}
.wm{display:flex;align-items:baseline;white-space:nowrap;font-weight:600;letter-spacing:-.045em;line-height:1;font-size:calc((100vw - 2 * var(--pad)) / 2.42);color:var(--line-strong);user-select:none}
.wm .oo{display:block;width:1.13em;height:.545em;margin:0 .01em 0 .035em;overflow:visible;flex:none}
.wm .oo .lp{fill:none;stroke:url(#brand);stroke-width:2.1;stroke-linejoin:round;opacity:.9}
@media (max-width:760px){:root{--pad:20px}.foot{flex-wrap:wrap;gap:16px 24px}.foot nav{margin-left:0}.wm-clip{margin-top:28px}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8FA8FF"/><stop offset="1" stop-color="#6EE0D2"/></linearGradient>
  <symbol id="g-mark" viewBox="0 0 24 24"><path d="M6.5 7.5c-2.8 0-4.5 2-4.5 4.5s1.7 4.5 4.5 4.5c4 0 7-9 11-9 2.8 0 4.5 2 4.5 4.5s-1.7 4.5-4.5 4.5c-4 0-7-9-11-9Z" fill="none" stroke="url(#brand)" stroke-width="2.2" stroke-linejoin="round"/></symbol>
</defs></svg>

<template id="footer-tpl">
  <div class="wrap">
    <p class="label"></p>
    <div class="foot">
      <a class="mark" href="#"><svg width="22" height="22" aria-hidden="true"><use href="#g-mark"/></svg>loopy</a>
      <span>Apache-2.0</span>
      <nav aria-label="Footer"><a href="#">GitHub</a><a href="#">Docs</a><a href="#">Examples</a></nav>
    </div>
  </div>
  <div class="wm-clip">
    <div class="wm" role="img" aria-label="loopy">
      <span aria-hidden="true">l</span>
      <svg class="oo" viewBox="0.9 6.4 22.2 11.2" preserveAspectRatio="none" aria-hidden="true">
        <path class="lp" d="M6.5 7.5c-2.8 0-4.5 2-4.5 4.5s1.7 4.5 4.5 4.5c4 0 7-9 11-9 2.8 0 4.5 2 4.5 4.5s-1.7 4.5-4.5 4.5c-4 0-7-9-11-9Z"/>
        <circle r=".8" fill="#0B1330"><animateMotion dur="9s" repeatCount="indefinite" path="M6.5 7.5c-2.8 0-4.5 2-4.5 4.5s1.7 4.5 4.5 4.5c4 0 7-9 11-9 2.8 0 4.5 2 4.5 4.5s-1.7 4.5-4.5 4.5c-4 0-7-9-11-9Z"/></circle>
      </svg>
      <span aria-hidden="true">py</span>
    </div>
  </div>
</template>

<script>
(() => {
  // Four cut depths. v7 ships with 70% visible, which the user found too deep.
  const OPTIONS = [
    { id: 'F0', visible: 0.70, note: 'current v7, for reference' },
    { id: 'F1', visible: 0.78, note: 'a touch higher' },
    { id: 'F2', visible: 0.85, note: 'the loop clears the edge with room' },
    { id: 'F3', visible: 0.92, note: 'only the descender of the p is cut' },
  ];
  const canvas = document.createElement('canvas').getContext('2d');
  const tpl = document.querySelector('#footer-tpl');

  function fit(wm, clip, visible) {
    wm.style.fontSize = ''; wm.style.marginTop = ''; clip.style.height = '';
    const cs = getComputedStyle(clip);
    const avail = clip.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const base = parseFloat(getComputedStyle(wm).fontSize);
    const fs = base * avail / wm.scrollWidth;
    wm.style.fontSize = fs.toFixed(2) + 'px';
    canvas.font = `600 ${fs}px ${getComputedStyle(wm).fontFamily}`;
    const m = canvas.measureText('lpy');
    const fbA = m.fontBoundingBoxAscent ?? fs * 0.95, fbD = m.fontBoundingBoxDescent ?? fs * 0.25;
    const baseline = (wm.offsetHeight - (fbA + fbD)) / 2 + fbA;
    const inkTop = baseline - m.actualBoundingBoxAscent, inkBottom = baseline + m.actualBoundingBoxDescent;
    wm.style.marginTop = (-inkTop).toFixed(2) + 'px';
    clip.style.height = ((inkBottom - inkTop) * visible).toFixed(2) + 'px';
  }

  const fits = OPTIONS.map(o => {
    const foot = document.createElement('footer');
    foot.className = 'opt';
    foot.append(tpl.content.cloneNode(true));
    foot.querySelector('.label').innerHTML = `<b>${o.id}</b> &nbsp; ${Math.round(o.visible * 100)}% visible, ${100 - Math.round(o.visible * 100)}% cut &nbsp; ${o.note}`;
    document.body.append(foot);
    const wm = foot.querySelector('.wm'), clip = foot.querySelector('.wm-clip');
    return () => fit(wm, clip, o.visible);
  });
  const fitAll = () => fits.forEach(f => f());
  let rt;
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(fitAll, 120); });
  fitAll();
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(fitAll);
})();
</script>
</body>
</html>
